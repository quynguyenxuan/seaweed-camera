version: '3.9'

services:
  master:
    image: chrislusf/seaweedfs:rocksdb_local_dev2
    command: '-v=2 master -ip=master -volumeSizeLimitMB=100 -volumePreallocate=false'   # use a remote dev image
    ports:
      - 9333:9333
      - 19333:19333
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - VOLUME_SPLIT_IN_SECONDS=60
    # command: "master -ip=master"
    volumes:
      - ./tmp:/app
  volume:
    image: chrislusf/seaweedfs:rocksdb_local_dev2      # use a remote dev image
    ports:
      - 8080:8080
      - 18080:18080
    command: '-v=2 volume -mserver="master:9333" -port=8080 -ip=volume -dir=/mnt/v1 -index=leveldbLarge -max=0'
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - VOLUME_SPLIT_IN_SECONDS=60
    volumes:
      - ./tmp:/app
      - ~/seaweedfsv1:/mnt/v1
      
    depends_on:
      - master
  filer:
    image: chrislusf/seaweedfs:rocksdb_local_dev2      # use a remote dev image
    ports:
      - 8888:8888
      - 18888:18888
    command: '-v=2 filer -master="master:9333" -ip.bind=0.0.0.0'
    volumes:
      - ./filer.toml:/etc/seaweedfs/filer.toml
      - ./s3.json:/etc/seaweedfs/s3.json
      - ./tmp:/app
      - ~/filer/rocksdb1:/mnt/rocksdb
    environment:
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      - master
      - volume
  filer2:
    image: chrislusf/seaweedfs:rocksdb_local_dev2 # use a remote dev image
    ports:
      - 8887:8888
      - 18887:18888
    command: '-v=2 filer -master="master:9333" -ip.bind=0.0.0.0'
    volumes:
      - ./filer.toml:/etc/seaweedfs/filer.toml
      - ./s3.json:/etc/seaweedfs/s3.json
      - ./tmp:/app
      - ~/filer/rocksdb2:/mnt/rocksdb
    environment:
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      - master
      - volume
  s3:
    image: chrislusf/seaweedfs:rocksdb_local_dev2 # use a remote dev image
    ports:
      - 8333:8333
    command: '-v=2 s3 -filer="filer:8888" -ip.bind=0.0.0.0'
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./filer.toml:/etc/seaweedfs/filer.toml
      - ./s3.json:/etc/seaweedfs/s3.json
      - ./tmp:/app
    depends_on:
      - master
      - volume
      - filer
  # webdav:
  #   image: chrislusf/seaweedfs:dev # use a remote dev image
  #   ports:
  #     - 7333:7333
  #   command: 'webdav -filer="filer:8888"'
